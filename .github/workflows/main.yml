name: Build & Push qBittorrent Custom

on:
  push:
    branches: [ "main" ]
  schedule:
    # 02:00 UTC = 03:00 AM España (Invierno) / 04:00 AM (Verano)
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: erchache2000/qbittorrent-py
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check_decision.outputs.should_build }}
      base_digest: ${{ steps.get_upstream.outputs.base_digest }}
      plugins_sha: ${{ steps.get_upstream.outputs.plugins_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtener Digest Base y Commit de Plugins
        id: get_upstream
        run: |
          BASE_IMAGE=$(grep -m 1 '^FROM' Dockerfile | awk '{print $2}')
          BASE_DIGEST=$(skopeo inspect --override-arch amd64 --override-os linux docker://$BASE_IMAGE --format '{{.Digest}}')
          PLUGINS_SHA=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/qbittorrent/search-plugins/commits/master | jq -r '.sha')

          echo "Base digest: $BASE_DIGEST"
          echo "Plugins SHA: $PLUGINS_SHA"
          echo "base_digest=$BASE_DIGEST" >> $GITHUB_OUTPUT
          echo "plugins_sha=$PLUGINS_SHA" >> $GITHUB_OUTPUT

      - name: Decidir si construir
        id: check_decision
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "Evento manual o push. Forzando construcción."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          GH_REGISTRY="${GHCR_IMAGE_NAME,,}:latest"
          INSPECT_JSON=$(skopeo inspect --creds "${{ github.actor }}:${{ secrets.GHCR_TAG }}" docker://$GH_REGISTRY 2>/dev/null || echo "{}")

          LAST_BASE=$(echo "$INSPECT_JSON" | jq -r '.Labels.base_image_digest // "none"')
          LAST_PLUGINS=$(echo "$INSPECT_JSON" | jq -r '.Labels.plugins_commit // "none"')

          CURRENT_BASE="${{ steps.get_upstream.outputs.base_digest }}"
          CURRENT_PLUGINS="${{ steps.get_upstream.outputs.plugins_sha }}"

          if [[ "$LAST_BASE" == "$CURRENT_BASE" && "$LAST_PLUGINS" == "$CURRENT_PLUGINS" ]]; then
            echo "Sin cambios en imagen base ni en plugins. Saltando build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Actualización detectada. Construyendo nueva imagen."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TAG }}

      - name: Definir Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y Subir
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          pull: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: |
            ${{ steps.meta.outputs.labels }}
            base_image_digest=${{ needs.check.outputs.base_digest }}
            plugins_commit=${{ needs.check.outputs.plugins_sha }}
